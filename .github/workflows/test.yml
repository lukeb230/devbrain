name: Tests

# Typecheck + unit tests over the pure libs on every push and PR. Vercel
# still builds main on its own; this is the regression net for the contracts
# teammates' plugins depend on (context digest, lights, lanes, merge order).

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: plugin-beta is in sync with plugin
        run: ./tools/sync-beta-plugin.sh && git diff --exit-code --stat plugin-beta
