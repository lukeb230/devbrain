name: Widget release

# Builds the DevBrain menu-bar widget (Tauri, macOS) and publishes it as a
# GitHub Release named widget-v<version>, where <version> comes from
# widget/src-tauri/tauri.conf.json. `devbrain update` on every teammate's Mac
# compares that version against /Applications/DevBrain.app and swaps in the
# new build.
#
# Builds BOTH channels (stable "DevBrain.app" and beta "DevBrain Beta.app")
# from the same commit and attaches all assets to one widget-v<version>
# release. To ship: edit widget/**, bump "version" in tauri.conf.json, push.
# Unbumped versions build as a check only.
#
# The .app is AD-HOC signed (codesign -s -; no Apple Developer ID, not
# notarized). Consequences, stated honestly:
#   - install.sh and `devbrain update` strip the quarantine flag after
#     downloading, so THOSE paths never see a Gatekeeper dialog.
#   - a DMG/zip downloaded in a browser IS quarantined, and current macOS
#     refuses an ad-hoc-signed quarantined app as "damaged" (there is no
#     right-click → Open escape hatch for that dialog). The fix is one line:
#       xattr -dr com.apple.quarantine "/Applications/DevBrain.app"
# Signing + notarization is a ready-to-run checklist in docs/NOTARIZE.md and
# only touches this file. See docs/PRIVATE-REPO.md for the private-repo day.

on:
  push:
    branches: [main]
    paths:
      - "widget/**"
      - ".github/workflows/widget-release.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: widget-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        channel: [stable, beta]
    defaults:
      run:
        working-directory: widget
    env:
      APP_NAME: ${{ matrix.channel == 'beta' && 'DevBrain Beta' || 'DevBrain' }}
      ASSET: ${{ matrix.channel == 'beta' && 'DevBrain-Beta' || 'DevBrain' }}
      BUNDLE_ID: ${{ matrix.channel == 'beta' && 'app.devbrain.desktop.beta' || 'app.devbrain.desktop' }}
      # Repo variables (Settings → Variables) override the site each channel
      # loads; both must also appear in src-tauri/capabilities/remote.json.
      DEVBRAIN_SITE: ${{ vars.DEVBRAIN_SITE || 'https://devbrain-seven.vercel.app' }}
      DEVBRAIN_BETA_SITE: ${{ vars.DEVBRAIN_BETA_SITE || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: widget/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: widget/src-tauri
          key: ${{ matrix.channel }}

      - name: Read version
        id: ver
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "tag=widget-v$v" >> "$GITHUB_OUTPUT"

      - name: Is this version's ${{ matrix.channel }} asset already released?
        id: exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx "$ASSET.dmg"; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$ASSET for ${{ steps.ver.outputs.tag }} already released — building as a check only."
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - run: npm ci

      - name: Build ${{ matrix.channel }} .app (Node bundled)
        run: ./scripts/build-channel.sh ${{ matrix.channel }}

      - name: Ad-hoc sign with the bundle identifier
        run: |
          codesign --force --deep -s - --identifier "$BUNDLE_ID" "src-tauri/target/release/bundle/macos/$APP_NAME.app"
          codesign -dv "src-tauri/target/release/bundle/macos/$APP_NAME.app" 2>&1 | grep -E "Identifier|flags"

      - name: Zip + DMG
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent "$APP_NAME.app" "$ASSET.app.zip"
          shasum -a 256 "$ASSET.app.zip" > "$ASSET.app.zip.sha256"
          rm -rf dmg && mkdir dmg && cp -R "$APP_NAME.app" dmg/ && ln -s /Applications dmg/Applications
          # Explicit size + HFS+: hdiutil's auto-sizing undershoots with the
          # bundled Node binary and fails with a misleading "No space left".
          hdiutil create -size 600m -fs HFS+ -volname "$APP_NAME" -srcfolder dmg -ov -format UDZO "$ASSET.dmg"
          ls -la "$ASSET.dmg"

      - name: Publish (create the release if needed, then upload this channel)
        if: steps.exists.outputs.released == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd src-tauri/target/release/bundle/macos
          gh release view "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" \
              --title "DevBrain widget ${{ steps.ver.outputs.version }}" \
              --notes "Built from ${GITHUB_SHA::7}.

New Mac — paste in Terminal (installs the app, no other prerequisites):
    curl -fsSL https://raw.githubusercontent.com/lukeb230/devbrain/main/install.sh | sh
(beta channel: append \`| sh -s -- beta\` instead of \`| sh\`)

Prefer the DMG? Drag DevBrain to Applications; macOS will call the unsigned app 'damaged' until you run:
    xattr -dr com.apple.quarantine /Applications/DevBrain.app

Then: click the brain in the bottom corner (or Alt+Space) → Sign in (browser) → Set up this Mac. Existing Macs update automatically." || true
          gh release upload "${{ steps.ver.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --clobber \
            "$ASSET.app.zip" "$ASSET.app.zip.sha256" "$ASSET.dmg"
