<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-user-select: none; user-select: none; cursor: pointer;
  }
  /* The badge emerges FROM the screen corner: it starts pushed diagonally
     off-corner (clipped by the window) and swings into place, so it reads as
     coming out of the edge rather than fading in on top of it. */
  #wrap {
    position: absolute; bottom: 4px; width: 48px; height: 48px;
    animation: emerge 360ms cubic-bezier(.2, 1.35, .35, 1) both;
    transition: transform 160ms ease;
  }
  body.br #wrap { right: 4px; }
  body.bl #wrap { left: 4px; }
  @keyframes emerge {
    from { opacity: 0; transform: translate(var(--ox), 24px) scale(.35) rotate(var(--orot)); }
    to   { opacity: 1; transform: translate(0, 0) scale(1) rotate(0deg); }
  }
  body.br { --ox: 24px;  --orot: 22deg; }
  body.bl { --ox: -24px; --orot: -22deg; }
  #wrap:hover { transform: scale(1.08); }

  /* The mark is raster art now (brain.png), so attention colour is a ring
     around it instead of a tint: red = your PR broke or your lane is
     contested, green = cleared to land, amber = something waits on you. */
  #wrap img { display: block; width: 48px; height: 48px; object-fit: contain;
              filter: drop-shadow(0 2px 8px rgba(15, 23, 42, .45)); }
  #ring { position: absolute; inset: -3px; border-radius: 50%; border: 3px solid currentColor;
          opacity: 0; transition: opacity 260ms ease; pointer-events: none; }
  body:not(.lvl-idle) #ring { opacity: 1; }
  body            { color: #e88078; }
  body.lvl-red    { color: #d03b3b; }
  body.lvl-green  { color: #0ca30c; }
  body.lvl-amber  { color: #d98514; }

  /* A slow halo instead of a flashing dot — legible in peripheral vision,
     not the kind of thing you want to kill after ten minutes. */
  #halo {
    position: absolute; bottom: 8px; width: 40px; height: 40px; border-radius: 50%;
    opacity: 0; pointer-events: none; background: currentColor;
  }
  body.br #halo { right: 8px; }
  body.bl #halo { left: 8px; }
  body:not(.lvl-idle) #halo { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe {
    0%   { opacity: .45; transform: scale(1); }
    70%  { opacity: 0;   transform: scale(1.9); }
    100% { opacity: 0;   transform: scale(1.9); }
  }
</style>
</head>
<body class="br lvl-idle">
  <div id="halo"></div>
  <div id="wrap" title="DevBrain">
    <div id="ring"></div>
    <img src="brain.png" alt="DevBrain" draggable="false" />
  </div>
  <script>
    const invoke = (cmd) => {
      try { return window.__TAURI__.core.invoke(cmd); } catch (e) { return Promise.resolve(); }
    };
    document.addEventListener("click", () => invoke("toggle_panel").catch(() => {}));
    invoke("get_corner").then((c) => {
      document.body.classList.remove("br", "bl");
      document.body.classList.add(c === "bl" ? "bl" : "br");
    }).catch(() => {});
    try {
      window.__TAURI__.event.listen("corner-changed", (e) => {
        document.body.classList.remove("br", "bl");
        document.body.classList.add(e.payload === "bl" ? "bl" : "br");
      });
      // The panel is signed in and knows what needs the user; it emits
      // {level, reason}. Unknown levels fall back to idle, so an older panel
      // simply leaves the badge neutral.
      window.__TAURI__.event.listen("badge-state", (e) => {
        const p = e.payload || {};
        const level = ["red", "green", "amber"].includes(p.level) ? p.level : "idle";
        document.body.classList.remove("lvl-idle", "lvl-red", "lvl-green", "lvl-amber");
        document.body.classList.add("lvl-" + level);
        document.getElementById("wrap").title =
          level === "idle" ? "DevBrain" : "DevBrain — " + (p.reason || "needs you");
      });
    } catch (e) {}
  </script>
</body>
</html>
