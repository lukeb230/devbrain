<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<style>
  html, body {
    margin: 0; height: 100%; overflow: hidden;
    background: transparent;
    -webkit-user-select: none; user-select: none; cursor: pointer;
  }
  /* The badge lives IN the corner. Hidden state: squashed to a sliver and
     pushed diagonally into the corner point (transform-origin sits there),
     so showing it unfurls out of the corner with a spring overshoot and
     hiding sucks it back in — the Dock's unminimize / minimize feel.
     Transitions (not keyframes) so a cursor that dips out and back mid-way
     reverses smoothly from wherever it is. */
  :root { --size: 48px; }
  #wrap {
    position: absolute; bottom: 4px; width: var(--size); height: var(--size);
    opacity: 0;
    transform: translate(var(--ox), 30px) scale(.22, .1) rotate(var(--orot));
    transition: transform 200ms cubic-bezier(.5, 0, .9, .4), opacity 140ms ease-in;
    will-change: transform, opacity;
  }
  body.shown #wrap {
    opacity: 1;
    transform: translate(0, 0) scale(1, 1) rotate(0deg);
    transition: transform 340ms cubic-bezier(.18, 1.45, .32, 1), opacity 120ms ease-out;
  }
  body.br #wrap { right: 4px; transform-origin: 100% 100%; }
  body.bl #wrap { left: 4px;  transform-origin: 0% 100%; }
  body.br { --ox: 26px;  --orot: 18deg; }
  body.bl { --ox: -26px; --orot: -18deg; }
  body.shown #wrap:hover { transform: scale(1.08); transition-duration: 160ms; }
  @media (prefers-reduced-motion: reduce) {
    #wrap, body.shown #wrap { transition: opacity 120ms ease; transform: none; }
  }

  /* The mark is raster art now (brain.png), so attention colour is a ring
     around it instead of a tint: red = your PR broke or your lane is
     contested, green = cleared to land, amber = something waits on you. */
  #wrap img { display: block; width: var(--size); height: var(--size); object-fit: contain;
              filter: drop-shadow(0 2px 8px rgba(15, 23, 42, .45)); }
  #ring { position: absolute; inset: -3px; border-radius: 50%; border: 3px solid currentColor;
          opacity: 0; transition: opacity 260ms ease; pointer-events: none; }
  body:not(.lvl-idle) #ring { opacity: 1; }
  body            { color: #e88078; }
  body.lvl-red    { color: #d03b3b; }
  body.lvl-green  { color: #0ca30c; }
  body.lvl-amber  { color: #d98514; }

  /* A slow halo instead of a flashing dot — legible in peripheral vision,
     not the kind of thing you want to kill after ten minutes. */
  #halo {
    position: absolute; bottom: 8px; width: calc(var(--size) - 8px); height: calc(var(--size) - 8px); border-radius: 50%;
    opacity: 0; pointer-events: none; background: currentColor;
  }
  body.br #halo { right: 8px; }
  body.bl #halo { left: 8px; }
  body:not(.lvl-idle) #halo { animation: breathe 2.6s ease-in-out infinite; }
  @keyframes breathe {
    0%   { opacity: .45; transform: scale(1); }
    70%  { opacity: 0;   transform: scale(1.9); }
    100% { opacity: 0;   transform: scale(1.9); }
  }
</style>
</head>
<body class="br lvl-idle shown">
  <div id="halo"></div>
  <div id="wrap" title="DevBrain">
    <div id="ring"></div>
    <img src="brain.png" alt="DevBrain" draggable="false" />
  </div>
  <script>
    const invoke = (cmd) => {
      try { return window.__TAURI__.core.invoke(cmd); } catch (e) { return Promise.resolve(); }
    };
    document.addEventListener("click", () => invoke("toggle_panel").catch(() => {}));
    // The badge fills its window (minus margins): the shell resizes the
    // window for the chosen badge size and pings "badge-scale".
    const fit = () => document.documentElement.style.setProperty("--size", Math.max(20, window.innerWidth - 10) + "px");
    fit();
    window.addEventListener("resize", fit);
    try { window.__TAURI__.event.listen("badge-scale", () => setTimeout(fit, 50)); } catch (e) {}
    // Rust tells us when the cursor enters/leaves the corner; the window is
    // shown before "badge-show" and hidden ~260ms after "badge-hide".
    try {
      window.__TAURI__.event.listen("badge-show", () => {
        // Force a frame at the hidden state first so a fresh show always
        // plays from the corner (the window was hidden, transitions froze).
        document.body.classList.remove("shown");
        void document.body.offsetWidth;
        requestAnimationFrame(() => document.body.classList.add("shown"));
      });
      window.__TAURI__.event.listen("badge-hide", () => document.body.classList.remove("shown"));
    } catch (e) {}
    invoke("get_corner").then((c) => {
      document.body.classList.remove("br", "bl");
      document.body.classList.add(c === "bl" ? "bl" : "br");
    }).catch(() => {});
    try {
      window.__TAURI__.event.listen("corner-changed", (e) => {
        document.body.classList.remove("br", "bl");
        document.body.classList.add(e.payload === "bl" ? "bl" : "br");
      });
      // The panel is signed in and knows what needs the user; it emits
      // {level, reason}. Unknown levels fall back to idle, so an older panel
      // simply leaves the badge neutral.
      window.__TAURI__.event.listen("badge-state", (e) => {
        const p = e.payload || {};
        const level = ["red", "green", "amber"].includes(p.level) ? p.level : "idle";
        document.body.classList.remove("lvl-idle", "lvl-red", "lvl-green", "lvl-amber");
        document.body.classList.add("lvl-" + level);
        document.getElementById("wrap").title =
          level === "idle" ? "DevBrain" : "DevBrain — " + (p.reason || "needs you");
      });
    } catch (e) {}
  </script>
</body>
</html>
